name: Build and deploy

# No schedule. The register is not fetched here: digital.nhs.uk refuses requests
# from datacentre address space, so every scheduled run failed with HTTP 403.
# Editions are downloaded by hand and recorded in data/facts (see
# docs/manual-updates.md); this workflow only renders what is already in the
# repository, and so makes no external requests at all.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest

      # Advisory: findings show as warnings on the run but never stop a deploy.
      - name: Check for LLM-cliché phrasing
        run: python -m pipeline.clichecheck --advisory

      - name: Build site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          # GitHub project pages are served from /<repo>/. Set this to an empty
          # string if you move the site to a custom domain or a user page.
          SITE_BASE_PATH: /${{ github.event.repository.name }}
        run: python -m pipeline.run

      # After the build, before anything is uploaded: a page that links to a
      # page that does not exist should stop the deploy, not reach readers.
      - name: Check internal links
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}
        run: python -m pipeline.linkcheck _site --base-path "$SITE_BASE_PATH"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
