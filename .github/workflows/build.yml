name: Build and deploy

# No schedule. The register is not fetched here: digital.nhs.uk refuses requests
# from datacentre address space, so every scheduled run failed with HTTP 403.
# Editions are downloaded by hand and recorded in data/facts (see
# docs/manual-updates.md); this workflow only renders what is already in the
# repository, and so makes no external requests at all.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tests, lint, type check, build and link check, as on every pull request.
      # The site is served from the root of its custom domain, set in the
      # repository's Pages settings. GitHub redirects the old address,
      # <owner>.github.io/<repo>/, there. To serve it as project pages again,
      # set site-url to https://<owner>.github.io and base-path to /<repo>.
      - uses: ./.github/actions/check
        with:
          site-url: https://healthdatauses.uk
          base-path: ""

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
