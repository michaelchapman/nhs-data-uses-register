name: Checks

# The same checks as the deploy workflow, on every pull request, without
# deploying. Like it, this makes no external requests.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest

      # Advisory: findings show as warnings on the run but never fail it.
      - name: Check for LLM-cliché phrasing
        run: python -m pipeline.clichecheck --advisory

      - name: Build site
        env:
          SITE_URL: https://healthdatauses.uk
          SITE_BASE_PATH: ""
        run: python -m pipeline.run

      - name: Check internal links
        run: python -m pipeline.linkcheck _site --base-path ""
